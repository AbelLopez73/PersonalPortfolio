name: Promote

on:
  push:
    branches: [desarrollo, pruebas]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.ref_name }}
        run: |
          if [ "$SOURCE" = "desarrollo" ]; then TARGET=pruebas; else TARGET=produccion; fi

          existing=$(gh pr list --repo "$REPO" --base "$TARGET" --head "$SOURCE" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open from $SOURCE to $TARGET"
            exit 0
          fi

          ahead=$(gh api "repos/$REPO/compare/$TARGET...$SOURCE" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "$TARGET already contains $SOURCE"
            exit 0
          fi

          gh pr create --repo "$REPO" --base "$TARGET" --head "$SOURCE" \
            --title "Promote $SOURCE to $TARGET" \
            --body "Automated promotion from \`$SOURCE\` to \`$TARGET\`. Merging this pull request deploys to the $TARGET environment."
